[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multiuav"
version = "0.1.0"
description = "Среда для отработки управления группой дронов одним оператором"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
cosys = ["cosysairsim"]
gamepad = ["pygame"]
sticks = ["evdev"]
plot = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["multiuav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
