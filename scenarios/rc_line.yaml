# Оператор ведёт дрон 0 с пульта, ведомые line_follow выстраиваются на его пути.
# Ведомые ни о чём не договариваются по радио, номеров не знают, GPS и лидара нет:
# только своя одометрия и передняя камера (см. docs/line_follow.md).
#
# Число ведомых: --followers N (0 — летает один ведущий).
# Клавиша L в терминале — посадить ведомых, ещё раз L — поднять обратно.
# Режим пульта: --mode althold (по умолчанию) или --mode acro; или тумблер, см. mode_switch.
# Всё сразу: scripts/demo.sh  (подробности — scripts/demo.sh --help)
name: rc_line
model: generic      # fast — экспериментальная доработка плагина, пока нестабильна (см. файл опыта, раздел 20)
drones: 5           # ведущий + 4 ведомых
rate_hz: 20
duration_s: null    # без ограничения времени; остановить — Ctrl+C

start:
  north: 0
  east: 0
  altitude: 10
  heading_deg: 0
  spacing: 6        # ведомые стоят колонной позади ведущего

leader:
  algorithm: gamepad
  params:
    joystick: 0
    axes: {roll: 0, pitch: 1, throttle: 2, yaw: 3}   # RadioMaster в режиме USB Joystick, AETR
    invert: []
    deadzone: 0.03
    mode: althold   # althold — как AltHold; acro — стики крутят, газ — тяга
    # Тумблер режима на пульте (раскомментируй и впиши номер оси из `python -m multiuav gamepad`):
    # mode_switch: {axis: 4, acro_above: 0.0}

followers:
  algorithm: line_follow
  params:
    distance: 6       # интервал по длине пути, м
    max_speed: 14     # чтобы ведомые успевали за быстрым ведущим
    k_vel: 1.0        # дрон в Unreal инерционнее: мягче регулятор скорости
    look: 4           # в Unreal команды исполняются с запаздыванием: смотреть дальше по пути
    eps: 0.6          # и мягче возвращаться на путь — иначе ведомые раскачиваются,
                      # и раскачка растёт к хвосту колонны (docs/line_follow.md)
    clock: auto       # в Unreal цикл может отставать — время берётся по часам
    min_altitude: 3   # садить и поднимать — клавишей L

perception:
  lidar_range: 40   # только чтобы симулятор проверял, не заслонён ли сосед стеной (алгоритм лидар не читает)
  vision_range: 40  # с какого расстояния камера замечает соседа, м
  fov_deg: 140      # передняя камера
  noise: 0.03       # ошибка оценки положения соседа — 3 % расстояния

limits:                  # подняты до пределов прошивки SimpleFlight (было 30, 90, 3, 200)
  max_tilt_deg: 32         # AltHold: наклон при полном стике (прошивка держит до 32,7°)
  max_yaw_rate_deg: 180    # поворот при полном стике
  max_climb: 6             # AltHold: скорость подъёма при полном газе, м/с (предел прошивки 6)
  max_rate_deg: 200        # Acro: вращение при полном стике
  hover_throttle: 0.5      # Acro в kinematic: газ висения

stop_on_collision: false   # ручной полёт: столкновение записывается, полёт продолжается
show_rc: true              # каналы пульта и режим поверх окна Unreal
