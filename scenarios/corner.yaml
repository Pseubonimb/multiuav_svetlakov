# Поворот за угол в плотной застройке.
# Улица шириной 10 м идёт на север и на 60 м поворачивает направо, на восток.
# Ведущий летит по центру улицы, ведомые следуют за ним.
name: corner
drones: 5
rate_hz: 20
duration_s: 150

start:            # где стоит ведущий; остальные выстраиваются колонной позади
  north: 0
  east: 0
  altitude: 10    # м
  heading_deg: 0  # смотрим на север
  spacing: 6      # м между дронами

leader:
  algorithm: waypoints        # для живого оператора: gamepad
  params:
    speed: 6                  # м/с
    waypoints:                # [север, восток, высота], м
      - [60, 0, 10]
      - [60, 160, 10]

followers:
  algorithm: single_file      # или leader_path, или свой: путь/к/файлу.py:Класс
  params:
    distance: 6

world:
  buildings:                  # прямоугольники в плане и высота, м
    - {north: [-80, 55], east: [5, 180], height: 40}     # внутренний угол поворота
    - {north: [-80, 65], east: [-60, -5], height: 40}    # слева от первой улицы
    - {north: [65, 120], east: [-60, 180], height: 40}   # за поворотом

finish: {north: [55, 65], east: [95, 180]}  # конец второй улицы
