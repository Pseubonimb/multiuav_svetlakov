# Оператор ведёт дрон 0 с пульта, ведомые летят за ним сами и объезжают препятствия.
# Ведомые ни о чём не договариваются по радио: видят соседей камерами и стены — лидаром.
#
# Число ведомых: --followers N (0 — летает один ведущий).
# Клавиша L в терминале — посадить ведомых, ещё раз L — поднять обратно.
# Режим пульта: --mode althold (по умолчанию) или --mode acro; или тумблер, см. mode_switch.
# Всё сразу: scripts/demo.sh  (подробности — scripts/demo.sh --help)
name: rc_group
model: fast2.5      # generic — тяга/вес 1,7. fast2.5 — тяга ×2,5, тяга/вес 4,3, рекомендую для Acro. fast<k> — тяга ×k, k от 1 до 4 (патчи 02, 03 плагина; файл опыта, раздел 22)
rotor_drag: 0.035   # сопротивление винтов, с/м (патч 04): 0 — «лёд», 0.035 — как в kinematic
drones: 5           # ведущий + 4 ведомых
rate_hz: 20
duration_s: null    # без ограничения времени; остановить — Ctrl+C

start:
  north: 0
  east: 0
  altitude: 10
  heading_deg: 0
  spacing: 6        # ведомые стоят колонной позади ведущего

leader:
  algorithm: gamepad
  params:
    joystick: 0
    axes: {roll: 0, pitch: 1, throttle: 2, yaw: 3}   # RadioMaster в режиме USB Joystick, AETR
    invert: []
    deadzone: 0.03
    mode: althold   # althold — как AltHold; acro — стики крутят, газ — тяга
    # Тумблер режима на пульте (раскомментируй и впиши номер оси из `python -m multiuav gamepad`):
    mode_switch: {axis: 4, acro_above: 0.0}

followers:
  algorithm: visual_follow   # или flock — стая Рейнольдса
  params:
    distance: 6
    max_speed: 14     # чтобы ведомые успевали за быстрым ведущим (было 8)
    min_altitude: 3   # ниже ~2,5 м лидар видит землю и ведомый «слепнет»; садить — клавишей L

perception:
  lidar_range: 20   # круговой лидар каждого дрона, м
  vision_range: 40  # с какого расстояния камеры замечают соседа, м
  fov_deg: 360      # обзор камер вокруг дрона
  noise: 0.02       # ошибка оценки положения соседа — 2 % расстояния

limits:                  # подняты до пределов прошивки SimpleFlight (было 30, 90, 3, 200)
  max_tilt_deg: 32         # AltHold: наклон при полном стике (прошивка держит до 32,7°)
  max_yaw_rate_deg: 180    # поворот при полном стике
  max_climb: 6             # AltHold: скорость подъёма при полном газе, м/с (предел прошивки 6)
  max_rate_deg: 200        # Acro: вращение при полном стике
  hover_throttle: 0.5      # Acro в kinematic: газ висения

stop_on_collision: false   # ручной полёт: столкновение записывается, полёт продолжается
show_rc: true              # каналы пульта и режим поверх окна Unreal
