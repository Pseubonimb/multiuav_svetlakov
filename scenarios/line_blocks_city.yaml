# 3D, шаг 2: тот же маршрут, но вдоль него стоят дома высотой 60 м (улицы шириной 10 м).
# Дома нужно поставить в сцену после каждого её запуска:
#   python examples/spawn_walls.py scenarios/line_blocks_city.yaml
# Затем:
#   python -m multiuav run scenarios/line_blocks_city.yaml --backend cosys --out runs/lbc --plot runs/lbc.png
name: line_blocks_city
drones: 7
rate_hz: 10
duration_s: 200

start: {north: 0, east: 0, altitude: 30, heading_deg: 0, spacing: 6}

leader:
  algorithm: stop_and_go
  params:
    speed: 5
    accel: 2
    waypoints:
      - [60, 0, 30]
      - [60, 40, 30, 4]          # остановка посреди улицы на 4 с
      - [60, 80, 30]
      - [140, 80, 30]
      - [140, 15, 30]

followers:
  algorithm: line_follow
  params:
    distance: 6
    k_speed: 0.5      # дрон в Unreal инерционнее: мягче догонять...
    k_vel: 1.0        # ...и мягче регулятор скорости, чтобы скорость не раскачивалась
    look: 4           # команды в Unreal исполняются с запаздыванием: смотреть дальше по пути
    eps: 0.6          # и мягче возвращаться на путь — иначе ведомые раскачиваются,
                      # и раскачка растёт к хвосту колонны (docs/line_follow.md)
    clock: auto       # цикл в Unreal может отставать — время берётся по часам
    seed: 0
    debug: true       # печатать в терминал, когда сосед пропал и когда путь записан заново
    world_from: scenarios/line_blocks_city.yaml   # дома заслоняют соседей от камеры

perception:
  lidar_range: 0      # без лидаров: 7 лидаров замедляют Unreal почти вдвое, а сам алгоритм
                      # лидар не использует (заслонение стенами — по world_from, см. ниже)
  vision_range: 40
  fov_deg: 140        # передняя камера
  noise: 0.03

world:
  buildings:
    - {north: [-80, 200], east: [-60, -5], height: 60}
    - {north: [-80, 55], east: [5, 160], height: 60}
    - {north: [65, 135], east: [-5, 75], height: 60}
    - {north: [145, 200], east: [-5, 160], height: 60}
    - {north: [55, 145], east: [85, 160], height: 60}
    - {north: [135, 145], east: [-5, 10], height: 60}

finish: {north: [135, 145], east: [10, 75]}
